<!DOCTYPE html>
<html lang="en">
<head>
<title>Connections map</title>
<meta property="og:description" content="Connections map" />
<meta charset='utf-8'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css' />
<script src='https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js'></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="https://unpkg.com/scrollama"></script>
<style>
	body { margin: 0; padding: 0; }
	html, body { height: 100%; font-size:16px; color: #111}
	#map {
		pointer-events: none;
		position:fixed;
		width:100%;
		height:100vh;
		top:0;
	}

	#steps {
		position: absolute;
		z-index: 11;
		margin: auto;
		width:100%;
	}

	.step {
		height:70vh;
		width:100%;
	}

	#date {
		font-weight: bold;
		margin-bottom: 3px;
	}

	#popup {
		position: fixed;
		padding: 20px 0;
		bottom:0;
		left:0;
		width:100%;
		z-index:12;
		background-color: rgba(255,255,255,0);
		font-family: sans-serif;
		text-align:center;
		margin:auto;
		pointer-events: none;
		display: flex;
		flex-direction: column;
	}

	#popup-content {
		text-align: center;
		margin: auto;
		transition: 0.5s all;
		width:100%;
		display: flex;
		flex-direction: column;
		align-content: center;
		justify-content: center;
		align-items: center;
	}

	#popup-content.fade {
		opacity:0.5;
	}

	.circles {
		height:12px;
		width:12px;
		display: inline-block;
	}

	.guesses {
		text-align: left;
	}

	.words {
		width:fit-content;
		display: inline-block;
	}

	.maplibregl-ctrl-bottom-right {
    	display: none;
	}

	@media (max-width: 600px) {
		.words {
			font-size: 0.8rem;
		}
	}
</style>
</head>
<body>
<div id="popup">
	<div id="date"></div>
	<div id="popup-content">
	</div>
</div>
<div id="steps"></div>
<div id="map"></div>
<script>

	window.onbeforeunload = function () {
		window.scrollTo(0, 0);
	}
	const width = window.innerWidth;

	let active = false;
	let layers;
	let uniqueLayers;
	let loaded = false;
	let latestDate;
	let latestRow = 0;
	let latestColumn = 0;
	let latestIndex = 0;
	let rows = 0;
	const dist = 0.1;
	const height = 10000;

    const style = {
        version: 8,
		lighting: {
			intensity: 0
		},
        sources: {},
        layers: [
            {
                id: 'background',
                type: 'background',
                paint: {
                    'background-color': '#fff'
                }
            }
        ]
    }

	const colors = {
		'b':'#b0c4ef',
		'p': '#ba81c5',
		'y': '#f9df6d',
		'g': '#a0c35a'
	}

	d3.csv(`./data/connections-tracker.csv`).then(function (data) {
		layers = [];
		for (const row of data) {
			const geo = buildRows(row);
			layers.push({
				...row,
				data: geo
			});
		}
		return layers;
	}).then((layers) => {
		uniqueLayers = getUniqueByKey(layers, 'date');
		rows = uniqueLayers.length;
		for (const [index, value] of uniqueLayers.entries()) {
			const newDiv = document.createElement('div');
			newDiv.classList.add('step');
			newDiv.setAttribute('id', index);
			const parent = document.getElementById('steps');
			parent.appendChild(newDiv);
			addLayers(index, value, layers)
		}
	}).then(() => {
		
		initScroller();
		addClick();

	}).catch(function (error) {
		// Handle any errors that occur during loading
		console.error("Error loading the CSV file:", error);
	});

    const map = new maplibregl.Map({
        container: 'map', // container id
        style, // style URL
        center: [0, 0.2], // starting position [lng, lat]
        zoom: 8.5, // starting zoom
        maplibreLogo: false,
		bearing: 50,
		pitch: 40
    });

	map.on('load', () => {
		loaded = true;
	});

	function buildRows(row) {
		if (latestDate != row.date) {
			latestDate = row.date;
			latestRow=latestRow+dist;
		}
		const layer = buildColumns(row);
		return layer;
	}

	function buildColumns(row) {
		const collection = turf.featureCollection([]);
		const colorParse = row.color.split(",");
		[1, 2, 3, 4].forEach((c) => {
			const box = [
				latestRow - (dist / 6),
				(c*dist) - (dist / 2),
				latestRow + (dist / 6),
				(c*dist) + (dist / 2),
			];
			const poly = turf.bboxPolygon(box, {
				properties: {
					guess: row.guess,
					date: row.date,
					color: colorParse[c-1]
				}
			});
			collection.features.push(poly);
		});
		return collection
	}

	function addLayers(index, value, layer) {
		// const colorParse = layer.color.split(",");
		// const wordsParse = layer.words.split(",");


		// console.log('index', index);
		// console.log('value', value);
		// console.log('layer', layer);

		const output = layer.filter((l) => {return l.date === value.date});

		// console.log('output arrays', output);

		const collection = turf.featureCollection([]);
		[...output].forEach((feature) => {
			collection.features.push(...feature.data.features);
		})
		const sourceName = `${index}-source`;
		const layerName = `${index}-layer`;
		console.log('collection', collection);
		map.addSource(sourceName, {
			'type': 'geojson',
			data: collection
		});

		map.addLayer({
			'id': `${layerName}-fill`,
			'type': 'fill',
			'source': sourceName,
			'filter': false,
			'paint': {
				// See the MapLibre Style Specification for details on data expressions.
				// https://maplibre.org/maplibre-style-spec/expressions/

				// Get the fill-extrusion-color from the source 'color' property.
				'fill-color': '#9a9a9a',

				// Get fill-extrusion-height from the source 'height' property.
				'fill-opacity': 0.05,
				'fill-outline-color': 'rgba(255,255,255,0)'
			}
		});

		// map.addLayer({
		// 	'id': `${layerName}-line`,
		// 	'type': 'line',
		// 	'source': sourceName,
		// 	'filter': ['==', ['get', 'guess'], "1"],
		// 	'paint': {
		// 		// See the MapLibre Style Specification for details on data expressions.
		// 		// https://maplibre.org/maplibre-style-spec/expressions/

		// 		// Get the fill-extrusion-color from the source 'color' property.
		// 		'line-color': '#9a9a9a',

		// 		// Get fill-extrusion-height from the source 'height' property.
		// 		'line-width': 1,
		// 		'line-opacity': 0.08
		// 	}
		// });

		map.addLayer({
			'id': layerName,
			'type': 'fill-extrusion',
			'source': sourceName,
			'paint': {
				// See the MapLibre Style Specification for details on data expressions.
				// https://maplibre.org/maplibre-style-spec/expressions/

				// Get the fill-extrusion-color from the source 'color' property.
				'fill-extrusion-color': [
					'match',
					['get', 'color'],
					'b',
					'#b0c4ef',
					'p',
					'#ba81c5',
					'y',
					'#f9df6d',
					'g',
					'#a0c35a',
					'#d3d3d3'
				],

				// Get fill-extrusion-height from the source 'height' property.
				'fill-extrusion-height': ['*', ['-', 7, ['to-number', ['get', 'guess']]], height],

				// Get fill-extrusion-base from the source 'base_height' property.
				'fill-extrusion-base': ['-', ['*', ['-', 7, ['to-number', ['get', 'guess']]], height], height],

				// Make extrusions slightly opaque for see through indoor walls.
				'fill-extrusion-opacity': 0.1,

				'fill-extrusion-opacity-transition': {
					delay: 0,
					duration: 500
				}
			}
		});
	}


	function initScroller() {
		// instantiate the scrollama
		const scroller = scrollama();

		// setup the instance, pass callback functions
		scroller
			.setup({
				step: ".step",
			})
			.onStepEnter((response) => {
				// active = false;
				if (loaded) {
					latestIndex = response.index;
					if (active) {
						map.easeTo({
							zoom: width < 600 ? 8 : 9,
							center: [((latestIndex * dist) + (dist * 6)), 0.25],
							bearing: 90,
							pitch: 90
						});
					} else {
						map.easeTo({
							zoom: width < 600 ? 7.5 : 8.5,
							center: [(latestIndex * dist), 0.2],
							bearing: 50,
							pitch: 40
						});
					}
					const base = response.index;
					map.setPaintProperty(`${base}-layer`, 'fill-extrusion-opacity', 0.85);

					// console.log('layers', layers[response.index]);
					map.setLayoutProperty(`${base}-layer`, 'visibility', 'visible');
					console.log('uniqueLayers[latestIndex].date', uniqueLayers[latestIndex].date);
					map.setFilter(`${base}-layer-fill`, ['==', ['get', 'date'], uniqueLayers[latestIndex].date]);
					const arr = Array.from(Array(rows).keys());
					arr.forEach((i) => {
						if (i != latestIndex && latestIndex > i) {
							map.setLayoutProperty(`${i}-layer`, 'visibility', 'none');
						}
					})

					const filtered = layers.filter((l) => { return l.date === uniqueLayers[latestIndex].date });
					document.getElementById('popup-content').innerHTML = ``;
					filtered.forEach((f) => {
						const colorParse = f.color.split(",");
						const wordsParse = f.words.split(",");
						const newDiv = document.createElement('div');
						newDiv.classList.add('guesses');
						const text = `
						<span class="circles" style="background:${colors[colorParse[3]]}"></span> <div class="words">${wordsParse[3]}</div>
						<span class="circles" style="background:${colors[colorParse[2]]}"></span> <div class="words">${wordsParse[2]}</div>
						<span class="circles" style="background:${colors[colorParse[1]]}"></span> <div class="words">${wordsParse[1]}</div>
						<span class="circles" style="background:${colors[colorParse[0]]}"></span> <div class="words">${wordsParse[0]}</div>
					`
						newDiv.innerHTML = text;
						document.getElementById('popup-content').appendChild(newDiv);
					});

					document.getElementById('date').innerHTML = `${uniqueLayers[latestIndex].date}`;
				}
			})
			.onStepExit((response) => {
				const base = response.index;
				map.setPaintProperty(`${base}-layer`, 'fill-extrusion-opacity', 0.1);
				map.setFilter(`${base}-layer-fill`, false);
			});
	}

	function addClick() {
		document.getElementById('steps').addEventListener('click', () => {
			active = !active;
			if (active) {
				map.easeTo({
					zoom: width < 600 ? 8 : 9,
					center: [((latestIndex * dist) + (dist * 6)), 0.25],
					bearing: 90,
					pitch: 90
				});
			} else {
				map.easeTo({
					zoom: width < 600 ? 7.5 : 8.5,
					center: [(latestIndex * dist), 0.2],
					bearing: 50,
					pitch: 40
				});
			}
		});
	}

	function getUniqueByKey(array, key) {
		const seen = new Set();
		return array.filter(item => {
			const value = item[key];
			if (seen.has(value)) {
				return false;
			}
			seen.add(value);
			return true;
		});
	}

</script>
</body>
</html>
